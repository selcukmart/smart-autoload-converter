# Smart Autoload Converter - Development Environment
# Usage: see Makefile (make build, make test, make analyze, etc.)

services:
  app:
    build:
      context: .
      target: dev
    container_name: smart-autoload-converter
    volumes:
      - .:/app
      - vendor:/app/vendor
      - workspace:/workspace
      - composer-cache:/root/.composer/cache
    working_dir: /app
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  vendor:
  workspace:
  composer-cache:
