name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  docker:
    name: Docker Build + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build --target dev -t smart-autoload-converter:test .

      - name: Run tests in Docker
        run: docker run --rm smart-autoload-converter:test php vendor/bin/phpunit --no-coverage --colors=never

      - name: Verify CLI commands
        run: docker run --rm smart-autoload-converter:test php bin/console list smart
