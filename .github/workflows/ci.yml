name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      - name: Verify CLI
        run: |
          php bin/smart-autoload-converter list
          php bin/smart-autoload-converter analyze -t fixtures/legacy-sample-project
          php bin/smart-autoload-converter convert -t fixtures/legacy-sample-project --export-path=/tmp/out --dry-run

  docker:
    name: Docker Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --target dev -t sac:test .

      - name: Test
        run: docker run --rm sac:test php vendor/bin/phpunit --no-coverage

      - name: CLI smoke test
        run: |
          docker run --rm sac:test php bin/smart-autoload-converter analyze -t /workspace/input
          docker run --rm sac:test php bin/smart-autoload-converter convert -t /workspace/input --export-path=/tmp/out --dry-run
