# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Converter/'
            - '../src/Controller/'
            - '../src/Helper/'
            - '../src/CustomLogger/'
            - '../src/GlobalTraits/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # === Infrastructure ===

    App\Infrastructure\Logger\ConversionLogger:
        arguments:
            $logFile: '%kernel.project_dir%/var/log/conversion.log'

    Psr\Log\LoggerInterface:
        alias: App\Infrastructure\Logger\ConversionLogger

    # === Domain: Conversion Services (config-driven) ===

    App\Domain\Conversion\Service\ReservedWordFixer:
        arguments:
            $customMap: '%smart_autoload.reserved_word_fixes%'

    App\Domain\Conversion\Service\ClassNameTransformer:
        arguments:
            $suffixTransforms: '%smart_autoload.suffix_transforms%'
            $reservedWordFixes: '%smart_autoload.reserved_word_fixes%'
            $separator: '%smart_autoload.separator%'

    # === Domain: Pipeline ===

    App\Domain\Pipeline\Service\Pipeline:
        calls:
            - [addStep, ['@App\Domain\Pipeline\Step\AnalyzeStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\BackupStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\PrepareOutputStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\RemoveIncludesStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\ReplaceReferencesStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\RenameFilesStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\AddNamespacesStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\GenerateComposerStep']]
            - [addStep, ['@App\Domain\Pipeline\Step\ComposerDumpStep']]
